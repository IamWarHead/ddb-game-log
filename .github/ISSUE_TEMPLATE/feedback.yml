name: Feedback or idea
description: Something that works but could be better, or a feature you miss
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        For something that is broken, use the bug report instead.
        Please keep secrets (cobalt cookie, webhook URLs) out of this form.

  - type: dropdown
    id: area
    attributes:
      label: What is it about
      options:
        - Rolls and chat cards
        - Card look
        - Character linking
        - Character sync
        - Combat tracker
        - Discord
        - Gamelog Config, the windows themselves
        - Memberships and tiers
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your feedback
      description: What you noticed, what you would change, and why it would help at your table.
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Gamelog Config → Debug panel.
      placeholder: 3.0.0
