title: DDB Gamelog
description: Documentation for DDB Gamelog v3 (Foundry VTT module).
url: https://iamwarhead.github.io
baseurl: /ddb-game-log

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Without this every page renders as bare HTML, with no theme and no stylesheet.
defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  Discord: https://discord.com/invite/HSTtrphyFg
  Patreon: https://www.patreon.com/iamwarhead/

footer_content: "DDB Gamelog by Roland Hegedus. All rights reserved."

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

exclude:
  - assets/img/README.md
